    <text class="sub" x="98" y="334.0">egress: VPC CIDR only</text>
    <text class="sub" x="44" y="392">Security groups: no inbound,</text>
    <text class="sub" x="44" y="406">egress only to the VPC CIDR.</text>
    <rect x="360" y="124" width="360" height="300" rx="16" fill="none" stroke="#7A4FE0" stroke-width="1.6" stroke-dasharray="7 6" opacity="0.85"/>
    <rect x="378" y="111" width="285.8" height="26" rx="8" fill="#7A4FE0"/>
    <text class="tagtext" x="520.9" y="128" text-anchor="middle">VPC ENDPOINTS · ACCOUNT-SCOPED POLICY</text>
    <rect class="box" x="378" y="146" width="324" height="44" rx="11"/>
    <rect x="392" y="155.0" width="26" height="26" rx="6" fill="#7A4FE0"/>
    <text class="lbl" x="432" y="166.0">execute-api</text>
    <text class="sub" x="432" y="183.0">private webhook ingress</text>
    <rect class="box" x="378" y="200" width="324" height="44" rx="11"/>
    <rect x="392" y="209.0" width="26" height="26" rx="6" fill="#7A4FE0"/>
    <text class="lbl" x="432" y="220.0">ecr.api · ecr.dkr</text>
    <text class="sub" x="432" y="237.0">image pull + push</text>
    <rect class="box" x="378" y="254" width="324" height="44" rx="11"/>
    <rect x="392" y="263.0" width="26" height="26" rx="6" fill="#7A4FE0"/>
    <text class="lbl" x="432" y="274.0">kms</text>
    <text class="sub" x="432" y="291.0">in-account signing</text>
    <rect class="box" x="378" y="308" width="324" height="44" rx="11"/>
    <rect x="392" y="317.0" width="26" height="26" rx="6" fill="#7A4FE0"/>
    <text class="lbl" x="432" y="328.0">secretsmanager · sts · sqs</text>
    <text class="sub" x="432" y="345.0">ecs · logs</text>
    <rect class="box" x="378" y="362" width="324" height="44" rx="11"/>
    <rect x="392" y="371.0" width="26" height="26" rx="6" fill="#7A4FE0"/>
    <text class="lbl" x="432" y="382.0">s3 (gateway)</text>
    <text class="sub" x="432" y="399.0">ECR layer storage</text>
    <rect class="box" x="760" y="150" width="250" height="58" rx="11"/>
    <rect x="774" y="166.0" width="26" height="26" rx="6" fill="#3F8C2E"/>
    <text class="lbl" x="814" y="177.0">Amazon ECR / S3</text>
    <text class="sub" x="814" y="194.0">layers · images</text>
    <rect class="box" x="760" y="230" width="250" height="58" rx="11"/>
    <rect x="774" y="246.0" width="26" height="26" rx="6" fill="#C7131F"/>
    <text class="lbl" x="814" y="257.0">AWS KMS</text>
    <text class="sub" x="814" y="274.0">signing key</text>
    <rect class="box" x="760" y="310" width="250" height="58" rx="11"/>
    <rect x="774" y="326.0" width="26" height="26" rx="6" fill="#C0276B"/>
    <text class="lbl" x="814" y="337.0">SQS · Secrets · Logs</text>
    <text class="sub" x="814" y="354.0">control-plane state</text>
