    <path class="conn" d="M 294 319 L 358 300" marker-end="url(#ah)"/>
    <path class="conn" d="M 294 159 L 378 168" marker-end="url(#ah)"/>
    <path class="conn" d="M 722 200 L 758 179" marker-end="url(#ah)"/>
    <path class="conn" d="M 722 250 L 758 259" marker-end="url(#ah)"/>
    <path class="conn" d="M 722 300 L 758 339" marker-end="url(#ah)"/>
    <rect class="box" x="440.0" y="540" width="300" height="52" rx="11"/>
    <rect x="454.0" y="553.0" width="26" height="26" rx="6" fill="#64748B"/>
    <text class="lbl" x="494.0" y="564.0">Public internet</text>
    <text class="sub" x="494.0" y="581.0">no route in · no route out</text>
    <path d="M 440.0 552 L 300 360" fill="none" stroke="#C7131F" stroke-width="1.8" marker-end="url(#ahR)" stroke-dasharray="6 5"/>
    <circle cx="220" cy="470" r="11" fill="#FFFFFF" stroke="#C7131F" stroke-width="1.8"/>
    <path d="M 215.05 465.05 L 224.95 474.95 M 224.95 465.05 L 215.05 474.95" stroke="#C7131F" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 740.0 552 L 980 360" fill="none" stroke="#C7131F" stroke-width="1.8" marker-end="url(#ahR)" stroke-dasharray="6 5"/>
