    <rect x="304.0" y="584" width="12" height="12" rx="3" fill="#3F8C2E"/>
    <text class="leg" x="322.0" y="594">Storage</text>
    <rect x="387.2" y="584" width="12" height="12" rx="3" fill="#C0276B"/>
    <text class="leg" x="405.2" y="594">Governance</text>
    <text class="wm" x="1156" y="594" text-anchor="end">akanjilal.dev</text>
</svg>
