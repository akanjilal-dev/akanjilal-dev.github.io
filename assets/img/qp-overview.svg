<svg width="100%" viewBox="0 0 680 940" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>The whole story on one page</title>
<desc>Top: the two rules, chance answers and destructive looking. Middle: the four-step strategy of blending, marking, amplifying, and looking once. Bottom: the machine stack from laptop to cold chip, and the shot loop that repeats runs until a histogram names the answer.</desc>
<defs>
<marker id="harr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5C6172" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="940" fill="#faf9f5"/>
<text x="340" y="34" text-anchor="middle" font-size="17" font-weight="600" fill="#1B2240">The whole story on one page</text>

<!-- ======== BAND 1: THE TWO RULES ======== -->
<text x="40" y="70" font-size="12" font-weight="600" fill="#B0653A" letter-spacing="2">THE TWO RULES</text>
<rect x="40" y="82" width="290" height="86" rx="10" fill="#ffffff" stroke="#B0653A" stroke-width="0.8"/>
<text x="58" y="108" font-size="13" font-weight="600" fill="#1B2240">Rule A — answers are chancy</text>
<text x="58" y="128" font-size="11.5" fill="#3A3F4E">Reading a qubit gives a random 0 or 1.</text>
<text x="58" y="146" font-size="11.5" fill="#3A3F4E">Hidden numbers only set the odds.</text>
<rect x="350" y="82" width="290" height="86" rx="10" fill="#ffffff" stroke="#B0653A" stroke-width="0.8"/>
<text x="368" y="108" font-size="13" font-weight="600" fill="#1B2240">Rule B — looking destroys</text>
<text x="368" y="128" font-size="11.5" fill="#3A3F4E">One look collapses the state to a plain bit.</text>
<text x="368" y="146" font-size="11.5" fill="#3A3F4E">The rich blend is gone for good.</text>

<!-- ======== BAND 2: THE STRATEGY ======== -->
<text x="40" y="208" font-size="12" font-weight="600" fill="#0E6E56" letter-spacing="2">THE STRATEGY — SHAPE THE ODDS BEFORE THE ONE LOOK</text>

<!-- step 1: blend -->
<rect x="40" y="222" width="136" height="150" rx="10" fill="#ffffff" stroke="#D8DBE3" stroke-width="0.8"/>
<text x="108" y="244" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1B2240">1. Blend everything</text>
<line x1="56" y1="330" x2="160" y2="330" stroke="#8A8F9E" stroke-width="0.7"/>
<g fill="#CECBF6" stroke="#7F77DD" stroke-width="0.5">
<rect x="60" y="300" width="16" height="30"/><rect x="82" y="300" width="16" height="30"/>
<rect x="104" y="300" width="16" height="30"/><rect x="126" y="300" width="16" height="30"/>
</g>
<text x="108" y="352" text-anchor="middle" font-size="10" fill="#5C6172">every option, equal odds</text>

<!-- step 2: mark -->
<rect x="204" y="222" width="136" height="150" rx="10" fill="#ffffff" stroke="#D8DBE3" stroke-width="0.8"/>
<text x="272" y="244" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1B2240">2. Mark the answer</text>
<line x1="220" y1="316" x2="324" y2="316" stroke="#8A8F9E" stroke-width="0.7"/>
<g fill="#CECBF6" stroke="#7F77DD" stroke-width="0.5">
<rect x="224" y="286" width="16" height="30"/><rect x="246" y="286" width="16" height="30"/>
<rect x="268" y="286" width="16" height="30"/>
</g>
<rect x="290" y="316" width="16" height="30" fill="#F4C7B4" stroke="#D85A30" stroke-width="0.6"/>
<text x="272" y="352" text-anchor="middle" font-size="10" fill="#5C6172">a hidden sign flip,</text>
<text x="272" y="366" text-anchor="middle" font-size="10" fill="#5C6172">invisible to any look</text>

<!-- step 3: interfere -->
<rect x="368" y="222" width="136" height="150" rx="10" fill="#ffffff" stroke="#D8DBE3" stroke-width="0.8"/>
<text x="436" y="244" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1B2240">3. Interfere</text>
<line x1="384" y1="340" x2="488" y2="340" stroke="#8A8F9E" stroke-width="0.7"/>
<g fill="#E4E5EC" stroke="#B7BBC6" stroke-width="0.5">
<rect x="388" y="334" width="16" height="6"/><rect x="410" y="334" width="16" height="6"/>
<rect x="432" y="334" width="16" height="6"/>
</g>
<rect x="454" y="262" width="16" height="78" fill="#9FE1CB" stroke="#0E6E56" stroke-width="0.6"/>
<text x="436" y="352" text-anchor="middle" font-size="10" fill="#5C6172">wrong answers cancel,</text>
<text x="436" y="366" text-anchor="middle" font-size="10" fill="#5C6172">the marked one grows</text>

<!-- step 4: look -->
<rect x="532" y="222" width="108" height="150" rx="10" fill="#FBF4EF" stroke="#B0653A" stroke-width="0.8"/>
<text x="586" y="244" text-anchor="middle" font-size="11.5" font-weight="600" fill="#712B13">4. Look once</text>
<circle cx="586" cy="300" r="30" fill="#ffffff" stroke="#B0653A" stroke-width="0.8"/>
<text x="586" y="308" text-anchor="middle" font-size="20" font-weight="600" fill="#B0653A">101</text>
<text x="586" y="352" text-anchor="middle" font-size="10" fill="#712B13">one random bitstring,</text>
<text x="586" y="366" text-anchor="middle" font-size="10" fill="#712B13">state destroyed</text>

<line x1="176" y1="297" x2="202" y2="297" stroke="#5C6172" stroke-width="1.4" marker-end="url(#harr)"/>
<line x1="340" y1="297" x2="366" y2="297" stroke="#5C6172" stroke-width="1.4" marker-end="url(#harr)"/>
<line x1="504" y1="297" x2="530" y2="297" stroke="#5C6172" stroke-width="1.4" marker-end="url(#harr)"/>

<!-- ======== BAND 3: THE MACHINE ======== -->
<text x="40" y="418" font-size="12" font-weight="600" fill="#185FA5" letter-spacing="2">THE MACHINE — WHAT PHYSICALLY RUNS IT</text>

<rect x="40" y="432" width="128" height="70" rx="10" fill="#ffffff" stroke="#D8DBE3" stroke-width="0.8"/>
<text x="104" y="458" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1B2240">Your program</text>
<text x="104" y="478" text-anchor="middle" font-size="10.5" fill="#5C6172">circuit written on</text>
<text x="104" y="492" text-anchor="middle" font-size="10.5" fill="#5C6172">an ordinary laptop</text>

<rect x="196" y="432" width="128" height="70" rx="10" fill="#ffffff" stroke="#D8DBE3" stroke-width="0.8"/>
<text x="260" y="458" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1B2240">Control electronics</text>
<text x="260" y="478" text-anchor="middle" font-size="10.5" fill="#5C6172">turn each gate into a</text>
<text x="260" y="492" text-anchor="middle" font-size="10.5" fill="#5C6172">shaped microwave pulse</text>

<rect x="352" y="432" width="128" height="70" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.8"/>
<text x="416" y="458" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0C447C">Refrigerator</text>
<text x="416" y="478" text-anchor="middle" font-size="10.5" fill="#185FA5">shields the chip at</text>
<text x="416" y="492" text-anchor="middle" font-size="10.5" fill="#185FA5">0.015° above abs. zero</text>

<rect x="508" y="432" width="132" height="70" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.8"/>
<text x="574" y="458" text-anchor="middle" font-size="11.5" font-weight="600" fill="#26215C">Quantum chip</text>
<text x="574" y="478" text-anchor="middle" font-size="10.5" fill="#534AB7">qubits blend, gates push,</text>
<text x="574" y="492" text-anchor="middle" font-size="10.5" fill="#534AB7">readout listens</text>

<line x1="168" y1="467" x2="194" y2="467" stroke="#5C6172" stroke-width="1.4" marker-end="url(#harr)"/>
<line x1="324" y1="467" x2="350" y2="467" stroke="#5C6172" stroke-width="1.4" marker-end="url(#harr)"/>
<line x1="480" y1="467" x2="506" y2="467" stroke="#5C6172" stroke-width="1.4" marker-end="url(#harr)"/>

<text x="340" y="530" text-anchor="middle" font-size="10.5" fill="#5C6172">the same path in reverse carries the faint readout echo back up, amplified into a recordable 0 or 1</text>

<!-- ======== BAND 4: THE SHOT LOOP ======== -->
<text x="40" y="574" font-size="12" font-weight="600" fill="#0E6E56" letter-spacing="2">THE LOOP — WHY IT RUNS A THOUSAND TIMES</text>

<rect x="40" y="588" width="150" height="64" rx="10" fill="#ffffff" stroke="#D8DBE3" stroke-width="0.8"/>
<text x="115" y="612" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1B2240">Run the circuit</text>
<text x="115" y="632" text-anchor="middle" font-size="10.5" fill="#5C6172">blend, mark, interfere</text>

<rect x="222" y="588" width="150" height="64" rx="10" fill="#FBF4EF" stroke="#B0653A" stroke-width="0.8"/>
<text x="297" y="612" text-anchor="middle" font-size="11.5" font-weight="600" fill="#712B13">Look once</text>
<text x="297" y="632" text-anchor="middle" font-size="10.5" fill="#993C1D">one random answer out</text>

<rect x="404" y="588" width="150" height="64" rx="10" fill="#ffffff" stroke="#D8DBE3" stroke-width="0.8"/>
<text x="479" y="612" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1B2240">Tally it</text>
<text x="479" y="632" text-anchor="middle" font-size="10.5" fill="#5C6172">add one to that bar</text>

<line x1="190" y1="620" x2="220" y2="620" stroke="#5C6172" stroke-width="1.4" marker-end="url(#harr)"/>
<line x1="372" y1="620" x2="402" y2="620" stroke="#5C6172" stroke-width="1.4" marker-end="url(#harr)"/>
<path d="M479 652 L479 684 L115 684 L115 654" fill="none" stroke="#0E6E56" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#harr)"/>
<text x="297" y="700" text-anchor="middle" font-size="10.5" fill="#0E6E56">repeat ~1000 times — each run starts fresh, because the look destroyed the last state</text>

<!-- ======== BAND 5: THE ANSWER ======== -->
<text x="40" y="744" font-size="12" font-weight="600" fill="#B0653A" letter-spacing="2">THE ANSWER — A HISTOGRAM, NOT A NUMBER</text>
<rect x="40" y="758" width="600" height="150" rx="10" fill="#ffffff" stroke="#D8DBE3" stroke-width="0.8"/>
<line x1="90" y1="874" x2="590" y2="874" stroke="#8A8F9E" stroke-width="0.8"/>
<g fill="#E4E5EC" stroke="#B7BBC6" stroke-width="0.5">
<rect x="110" y="866" width="40" height="8"/>
<rect x="170" y="868" width="40" height="6"/>
<rect x="230" y="866" width="40" height="8"/>
<rect x="290" y="868" width="40" height="6"/>
<rect x="350" y="866" width="40" height="8"/>
<rect x="470" y="868" width="40" height="6"/>
<rect x="530" y="866" width="40" height="8"/>
</g>
<rect x="410" y="782" width="40" height="92" fill="#9FE1CB" stroke="#0E6E56" stroke-width="0.8"/>
<text x="430" y="774" text-anchor="middle" font-size="11" font-weight="600" fill="#0E6E56">tallest bar = the answer</text>
<text x="130" y="890" text-anchor="middle" font-size="9.5" fill="#8A8F9E">000</text>
<text x="190" y="890" text-anchor="middle" font-size="9.5" fill="#8A8F9E">001</text>
<text x="250" y="890" text-anchor="middle" font-size="9.5" fill="#8A8F9E">010</text>
<text x="310" y="890" text-anchor="middle" font-size="9.5" fill="#8A8F9E">011</text>
<text x="370" y="890" text-anchor="middle" font-size="9.5" fill="#8A8F9E">100</text>
<text x="430" y="890" text-anchor="middle" font-size="10" font-weight="600" fill="#0E6E56">101</text>
<text x="490" y="890" text-anchor="middle" font-size="9.5" fill="#8A8F9E">110</text>
<text x="550" y="890" text-anchor="middle" font-size="9.5" fill="#8A8F9E">111</text>
<text x="340" y="930" text-anchor="middle" font-size="10.5" fill="#5C6172">no single run proves anything — a thousand chancy, destructive looks together name the answer beyond doubt</text>
</svg>
