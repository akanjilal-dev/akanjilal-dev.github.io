<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Rabi oscillation and coherence decay</title>
<desc>Left panel: the probability of finding the qubit in state 1 oscillates as the drive pulse gets longer, and stopping at half a cycle makes an X gate. Right panel: T1 energy decay and T2 phase decay limit how long the qubit stays quantum.</desc>
<rect x="0" y="0" width="680" height="400" fill="#ffffff"/>
<text x="340" y="30" text-anchor="middle" font-size="16" font-weight="500" fill="#1B2240">Driving a qubit, and how long it stays quantum</text>

<!-- Left: Rabi -->
<rect x="24" y="52" width="310" height="320" rx="10" fill="#ffffff" stroke="#B4B2A9" stroke-width="0.6"/>
<text x="179" y="78" text-anchor="middle" font-size="13" font-weight="500" fill="#1B2240">Rabi oscillation</text>
<line x1="56" y1="300" x2="310" y2="300" stroke="#5F5E5A" stroke-width="0.8"/>
<line x1="56" y1="300" x2="56" y2="110" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="310" y="318" text-anchor="end" font-size="11" fill="#5F5E5A">pulse duration</text>
<text x="50" y="106" text-anchor="start" font-size="11" fill="#5F5E5A">P(1)</text>
<text x="48" y="304" text-anchor="end" font-size="10" fill="#5F5E5A">0</text>
<text x="48" y="124" text-anchor="end" font-size="10" fill="#5F5E5A">1</text>
<!-- sinusoid P1 = sin^2 -->
<path d="M56 300 C76 300 86 120 106 120 C126 120 136 300 156 300 C176 300 186 120 206 120 C226 120 236 300 256 300 C276 300 286 120 306 120" fill="none" stroke="#B0653A" stroke-width="2"/>
<!-- pi pulse marker -->
<line x1="106" y1="300" x2="106" y2="120" stroke="#1B2240" stroke-width="0.8" stroke-dasharray="4 3"/>
<circle cx="106" cy="120" r="4" fill="#1B2240"/>
<text x="106" y="345" text-anchor="middle" font-size="11" fill="#1B2240">stop here:</text>
<text x="106" y="360" text-anchor="middle" font-size="11" fill="#1B2240">a &#960; pulse = X gate</text>
<!-- half pi marker -->
<line x1="81" y1="300" x2="81" y2="210" stroke="#0E6E56" stroke-width="0.8" stroke-dasharray="4 3"/>
<circle cx="81" cy="210" r="3.5" fill="#0E6E56"/>
<text x="215" y="345" text-anchor="middle" font-size="11" fill="#0E6E56">half that (&#960;/2) lands on</text>
<text x="215" y="360" text-anchor="middle" font-size="11" fill="#0E6E56">the equator: the SX gate</text>

<!-- Right: decay -->
<rect x="350" y="52" width="306" height="320" rx="10" fill="#ffffff" stroke="#B4B2A9" stroke-width="0.6"/>
<text x="503" y="78" text-anchor="middle" font-size="13" font-weight="500" fill="#1B2240">Coherence decay</text>
<line x1="382" y1="300" x2="632" y2="300" stroke="#5F5E5A" stroke-width="0.8"/>
<line x1="382" y1="300" x2="382" y2="110" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="632" y="318" text-anchor="end" font-size="11" fill="#5F5E5A">waiting time</text>
<!-- T1 exponential -->
<path d="M382 120 C430 130 470 200 520 250 C560 282 600 294 632 297" fill="none" stroke="#B0653A" stroke-width="2"/>
<text x="470" y="160" font-size="11" fill="#B0653A">T&#8321;: |1&#8250; decays to |0&#8250;</text>
<!-- T2 faster exponential -->
<path d="M382 120 C412 150 434 250 470 280 C500 294 540 298 632 299" fill="none" stroke="#0E6E56" stroke-width="2" stroke-dasharray="6 4"/>
<text x="418" y="262" font-size="11" fill="#0E6E56">T&#8322;: phase blurs out</text>
<text x="503" y="345" text-anchor="middle" font-size="11" fill="#5F5E5A">both near 100 to 300 &#956;s on current transmons,</text>
<text x="503" y="360" text-anchor="middle" font-size="11" fill="#5F5E5A">so the whole circuit must finish well inside that window</text>
</svg>
