<svg width="100%" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>IBM transmon qubit, control, and dispersive readout inside a dilution refrigerator</title>
<desc>Microwave control and readout lines run from room temperature down through cooling stages to a superconducting chip at about 15 millikelvin, where a transmon is read out through a dedicated resonator and amplifier chain.</desc>
<rect x="0" y="0" width="680" height="560" fill="#ffffff"/>
<text x="340" y="32" text-anchor="middle" font-size="16" font-weight="500" fill="#26215C">IBM Heron building block: one transmon, its control, and its readout</text>

<!-- fridge stages -->
<rect x="40" y="52" width="300" height="70" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.6"/>
<text x="52" y="78" font-size="13" font-weight="500" fill="#0C447C">300 K room temperature</text>
<text x="52" y="98" font-size="12" fill="#185FA5">signal generators, control electronics</text>

<rect x="40" y="134" width="300" height="60" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.6"/>
<text x="52" y="158" font-size="13" font-weight="500" fill="#085041">4 K stage</text>
<text x="52" y="177" font-size="12" fill="#0F6E56">HEMT amplifier, heavy attenuation</text>

<rect x="40" y="206" width="300" height="120" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.6"/>
<text x="52" y="230" font-size="13" font-weight="500" fill="#26215C">~15 mK mixing chamber</text>
<text x="52" y="249" font-size="12" fill="#534AB7">quantum-limited amplifier (JTWPA)</text>
<text x="52" y="267" font-size="12" fill="#534AB7">superconducting chip lives here</text>
<text x="52" y="295" font-size="11" fill="#534AB7">cold enough that thermal energy</text>
<text x="52" y="311" font-size="11" fill="#534AB7">stays well below the qubit gap</text>

<!-- lines down -->
<line x1="200" y1="122" x2="200" y2="206" stroke="#D85A30" stroke-width="1.4"/>
<line x1="250" y1="122" x2="250" y2="206" stroke="#378ADD" stroke-width="1.4"/>
<text x="150" y="200" font-size="10" fill="#993C1D" text-anchor="end">drive</text>
<text x="300" y="200" font-size="10" fill="#0C447C">readout</text>

<!-- transmon on chip -->
<rect x="360" y="60" width="290" height="266" rx="10" fill="#ffffff" stroke="#B4B2A9" stroke-width="0.6"/>
<text x="505" y="82" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">Transmon qubit (cross capacitor + junction)</text>

<!-- cross capacitor -->
<rect x="470" y="120" width="70" height="20" rx="4" fill="#CECBF6" stroke="#534AB7" stroke-width="0.6"/>
<rect x="495" y="98" width="20" height="70" rx="4" fill="#CECBF6" stroke="#534AB7" stroke-width="0.6"/>
<!-- josephson junction -->
<rect x="500" y="168" width="10" height="16" fill="#D85A30"/>
<line x1="505" y1="140" x2="505" y2="168" stroke="#534AB7" stroke-width="1.4"/>
<line x1="505" y1="184" x2="505" y2="205" stroke="#534AB7" stroke-width="1.4"/>
<rect x="480" y="205" width="50" height="12" rx="3" fill="#CECBF6" stroke="#534AB7" stroke-width="0.6"/>
<text x="548" y="178" font-size="11" fill="#993C1D">Josephson junction</text>
<text x="548" y="192" font-size="11" fill="#993C1D">(nonlinear inductance)</text>

<!-- readout resonator -->
<path d="M420 250 q10 -14 20 0 q10 14 20 0 q10 -14 20 0 q10 14 20 0" fill="none" stroke="#378ADD" stroke-width="1.6"/>
<text x="420" y="290" font-size="11" fill="#0C447C">readout resonator, dispersively coupled</text>
<text x="420" y="306" font-size="11" fill="#0C447C">its frequency shifts with the qubit state</text>

<!-- energy ladder -->
<text x="60" y="360" font-size="13" font-weight="500" fill="#2C2C2A">Energy ladder of one transmon</text>
<line x1="70" y1="470" x2="200" y2="470" stroke="#5F5E5A" stroke-width="2"/>
<text x="210" y="474" font-size="12" fill="#444441">|0&#8250; ground state</text>
<line x1="70" y1="430" x2="200" y2="430" stroke="#185FA5" stroke-width="2"/>
<text x="210" y="434" font-size="12" fill="#0C447C">|1&#8250; first excited, ~5 GHz above |0&#8250;</text>
<line x1="70" y1="400" x2="200" y2="400" stroke="#B4B2A9" stroke-width="2" stroke-dasharray="3 3"/>
<text x="210" y="404" font-size="12" fill="#888780">|2&#8250; higher level, spaced differently</text>
<text x="70" y="500" font-size="11" fill="#5F5E5A">The unequal spacing (anharmonicity, about -300 MHz)</text>
<text x="70" y="516" font-size="11" fill="#5F5E5A">lets a shaped microwave pulse drive |0&#8250; to |1&#8250; alone.</text>

<!-- readout blob -->
<text x="430" y="360" font-size="13" font-weight="500" fill="#2C2C2A">Single-shot readout (I/Q plane)</text>
<circle cx="480" cy="440" r="34" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.6"/>
<text x="480" y="444" text-anchor="middle" font-size="12" fill="#0C447C">read 0</text>
<circle cx="590" cy="440" r="34" fill="#FAECE7" stroke="#D85A30" stroke-width="0.6"/>
<text x="590" y="444" text-anchor="middle" font-size="12" fill="#993C1D">read 1</text>
<text x="430" y="500" font-size="11" fill="#5F5E5A">The probe tone comes back in one of two clusters.</text>
<text x="430" y="516" font-size="11" fill="#5F5E5A">Picking a cluster is the projective collapse.</text>
</svg>
