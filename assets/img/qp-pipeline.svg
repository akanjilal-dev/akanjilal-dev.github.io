<svg width="100%" viewBox="0 0 680 880" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Physical execution pipeline of a quantum computer</title>
<desc>A logical circuit is transpiled into native gates, turned into microwave pulses, sent to the cold chip where qubits evolve, then probed by readout which collapses each qubit to a classical bit, and the whole run is repeated many times to build a histogram.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="880" fill="#ffffff"/>
<text x="340" y="34" text-anchor="middle" font-size="16" font-weight="500" fill="#2C2C2A">How one quantum program is physically run, start to finish</text>

<!-- classic prep boxes (gray) -->
<g>
<rect x="130" y="56" width="420" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/>
<text x="340" y="80" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Quantum circuit (logical gates)</text>
<text x="340" y="99" text-anchor="middle" font-size="12" fill="#5F5E5A">Hadamard, oracle, diffusion, measure</text>
</g>
<g>
<rect x="130" y="146" width="420" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/>
<text x="340" y="170" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Transpile to the hardware</text>
<text x="340" y="189" text-anchor="middle" font-size="12" fill="#5F5E5A">rebuild into native gates, insert SWAPs for wiring</text>
</g>
<g>
<rect x="130" y="236" width="420" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/>
<text x="340" y="260" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Compile to a pulse schedule</text>
<text x="340" y="279" text-anchor="middle" font-size="12" fill="#5F5E5A">each native gate becomes a shaped microwave pulse</text>
</g>

<!-- quantum evolution boxes (purple) -->
<g>
<rect x="130" y="326" width="420" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.6"/>
<text x="340" y="350" text-anchor="middle" font-size="14" font-weight="500" fill="#26215C">Send pulses down the refrigerator</text>
<text x="340" y="369" text-anchor="middle" font-size="12" fill="#534AB7">room-temp electronics down to the 15 mK chip</text>
</g>
<g>
<rect x="130" y="416" width="420" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.6"/>
<text x="340" y="440" text-anchor="middle" font-size="14" font-weight="500" fill="#26215C">Qubits evolve (unitary)</text>
<text x="340" y="459" text-anchor="middle" font-size="12" fill="#534AB7">pulses rotate the amplitudes, nothing is read yet</text>
</g>

<!-- measurement boxes (coral) -->
<g>
<rect x="130" y="506" width="420" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.6"/>
<text x="340" y="530" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Probe the readout resonators</text>
<text x="340" y="549" text-anchor="middle" font-size="12" fill="#993C1D">a microwave tone senses each qubit indirectly</text>
</g>
<g>
<rect x="130" y="596" width="420" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.6"/>
<text x="340" y="620" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Discriminate and collapse</text>
<text x="340" y="639" text-anchor="middle" font-size="12" fill="#993C1D">signal lands in the 0 or 1 cluster, superposition is gone</text>
</g>

<!-- result boxes (teal) -->
<g>
<rect x="130" y="686" width="420" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.6"/>
<text x="340" y="710" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">Record one bitstring</text>
<text x="340" y="729" text-anchor="middle" font-size="12" fill="#0F6E56">one classical result for this single shot</text>
</g>
<g>
<rect x="130" y="776" width="420" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.6"/>
<text x="340" y="800" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">Repeat many shots, build the histogram</text>
<text x="340" y="819" text-anchor="middle" font-size="12" fill="#0F6E56">the tall bar names the answer</text>
</g>

<!-- straight arrows -->
<line x1="340" y1="112" x2="340" y2="144" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="340" y1="202" x2="340" y2="234" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="340" y1="292" x2="340" y2="324" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="340" y1="382" x2="340" y2="414" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="340" y1="472" x2="340" y2="504" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="340" y1="562" x2="340" y2="594" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="340" y1="652" x2="340" y2="684" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="340" y1="742" x2="340" y2="774" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>

<!-- shot loop on the right -->
<path d="M550 714 L610 714 L610 354 L552 354" fill="none" stroke="#1D9E75" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<text x="620" y="536" font-size="12" fill="#0F6E56" transform="rotate(90 620 536)">repeat for every shot</text>
</svg>
