name: refresh-live
on:
  schedule:
    - cron: "0 */4 * * *"      # every four hours
  workflow_dispatch: {}         # manual run from the Actions tab
permissions:
  contents: write
concurrency:
  group: refresh-live
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional vendor SDKs
        run: |
          python -m pip install --upgrade pip
          pip install boto3 || true
          pip install qiskit-ibm-runtime || true
          pip install azure-quantum azure-identity || true
      - name: Collect live signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
          IBM_QUANTUM_INSTANCE: ${{ secrets.IBM_QUANTUM_INSTANCE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_QUANTUM_WORKSPACE: ${{ secrets.AZURE_QUANTUM_WORKSPACE }}
          AZURE_QUANTUM_LOCATION: ${{ secrets.AZURE_QUANTUM_LOCATION }}
        run: python scripts/refresh_live.py
      - name: Commit when changed
        run: |
          git config user.name "live-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/data/live.json
          if git diff --quiet --staged; then
            echo "no change"
          else
            git commit -m "refresh live signals"
            git push
          fi
