name: refresh-live-data
on:
  schedule:
    - cron: "0 */4 * * *"      # every four hours
  workflow_dispatch: {}         # allow a manual run from the Actions tab
permissions:
  contents: write
concurrency:
  group: refresh-live-data
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch live data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-live-data.mjs
      - name: Commit when changed
        run: |
          git config user.name "live-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/data
          if git diff --quiet --staged; then
            echo "no change"
          else
            git commit -m "refresh live data"
            git push
          fi
